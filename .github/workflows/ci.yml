name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Syntax-Check (alle JS-Module + vokabeln.js + index.html)
        run: npm run check

      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium

      - name: Smoke-Test
        run: npm test
